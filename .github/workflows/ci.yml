name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.run_attempt != 1 && github.run_id || 'first-attempt' }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    needs: [check, test]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
      - run: npm ci
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Check Pages URL
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: test "${PAGES_URL%/}" = "https://edmcman.github.io/LinkHints"
      - name: Build signed extension and feed
        env:
          CHROME_KEY_PEM: ${{ secrets.CHROME_KEY_PEM }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -eu
          test -n "$CHROME_KEY_PEM"
          mkdir -p dist-chrome
          trap 'rm -f dist-chrome/key.pem' EXIT
          umask 077
          printf '%s' "$CHROME_KEY_PEM" | base64 --decode > dist-chrome/key.pem
          CHROME_EXTENSION_ID="$(node scripts/publish-chrome.cjs id dist-chrome/key.pem)"
          export CHROME_BUILD_VERSION="$(node scripts/publish-chrome.cjs version "$RUN_NUMBER")"
          npm run build:chrome
          node scripts/publish-chrome.cjs publish dist-chrome/key.pem "$CHROME_EXTENSION_ID" "$RUN_NUMBER"
          chmod -R a+rX compiled-docs
      - name: Verify branch head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)" = "$EXPECTED_SHA"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: compiled-docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  check:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Cache node_modules
        id: cache-node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node_modules-${{ hashFiles('package.json', 'package-lock.json') }}

      - name: npm ci
        if: steps.cache-node_modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Distribution tests
        run: node --test scripts/publish-chrome.test.cjs

      - name: npm test
        run: npm test

      - name: Remove generated key
        if: ${{ always() }}
        run: rm -f dist-chrome/key.pem

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v6
        with:
          name: link-hints-chrome
          path: dist-chrome/

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v6
        with:
          name: link-hints-firefox
          path: dist-firefox/

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: [chromium, firefox]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Cache node_modules
        id: cache-node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node_modules-${{ hashFiles('package.json', 'package-lock.json') }}

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: npm ci
        if: steps.cache-node_modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Prepare apt cache dir
        run: |
          sudo mkdir -p /var/cache/apt/archives
          sudo chmod -R a+rwX /var/cache/apt/archives

      - name: Cache apt packages
        id: cache-apt
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install playwright dependencies
        run: sudo npx playwright install-deps

      - name: Install Playwright browsers
        run: npx playwright install ${{ matrix.browser }}

      - name: Run Playwright tests
        run: xvfb-run -a npm run test:playwright:${{ matrix.browser }}

      - name: Fix apt cache perms for saving
        if: always()
        run: sudo chmod -R a+rwX /var/cache/apt/archives

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
